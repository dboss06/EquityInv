<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - EquityInv</title>
    <link rel="stylesheet" href="../../src/output.css" />
    <link rel="icon" href="../../assets/favicon.png" type="image/x-icon" />
</head>

<body class="min-h-screen bg-[#f5f5f5]">
    <main class="flex min-h-[calc(100vh-2px)] items-center justify-center px-4">
        <div class="w-full max-w-[500px] rounded-[18px] bg-white px-4 py-4 sm:px-5">
            <div class="flex justify-center">
                <img src="../../assets/logo.png" alt="Equity Inv" class="h-20 w-10object-contain">
            </div>
            <div class="mt-1 text-center">
                <h1 class="text-[21px] font-bold leading-tight text-gray-900 sm:text-[24px]">
                    Welcome Back
                </h1>
                <p class="mt-0.5 text-[12px] text-gray-500 sm:text-[14px]">
                    Login to your Equity Inv account to continue.
                </p>
            </div>
            <form class="mt-3" action="" method="POST">
                <div>
                    <label for="phone" class="mb-1 block pl-2 text-[12px] font-medium text-[#111827]">
                        Phone
                    </label>
                    <input id="phone" name="phone" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="tel"
                        placeholder="Enter phone number"
                        class="h-[38px] w-full border border-[#d2d2d2] rounded-[8px] bg-[#e7eefb] px-2 text-[12px] text-[#111827] outline-none placeholder:text-[#777] focus:ring-2 focus:ring-[#d6a52d]">
                </div>
                <div class="mt-3">
                    <label for="password" class="mb-1 block pl-2 text-[12px] font-medium text-[#111827]">
                        Password
                    </label>
                    <input id="password" name="password" type="password" autocomplete="current-password"
                        placeholder="Enter password"
                        class="h-[38px] border border-[#d2d2d2] w-full rounded-[8px] bg-[#e7eefb] px-2 text-[12px] text-[#111827] outline-none placeholder:text-[#777] focus:ring-2 focus:ring-[#d6a52d]">
                </div>

                <button type="submit"
                    class="mt-8 h-[46px] w-full rounded-[9px] bg-brand-gold text-[13px] font-bold text-white transition hover:bg-brand-gold hover:opacity-90 active:scale-[0.99]">
                    Sign in
                </button>
            </form>
            <p class="mt-5 text-center text-[12px] text-[#707070]">
                Don't have an account?
                <a href="register.html" class="font-medium text-brand-gold hover:underline">
                    Sign Up
                </a>
            </p>
        </div>
    </main>
</body>

</html>
<script>
    const phoneInput = document.getElementById('phone');

    phoneInput.addEventListener('input', (event) => {
        // Replace any character that is NOT a digit (0-9) with an empty string
        event.target.value = event.target.value.replace(/\D/g, '');
    });
</script>
