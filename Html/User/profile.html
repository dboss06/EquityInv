<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard - EquityInv</title>
    <link rel="stylesheet" href="../../src/output.css" />
    <link rel="icon" href="../../assets/favicon.png" type="image/x-icon" />
    <!-- Material Symbols Outlined -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://kit.fontawesome.com/46f4625f97.js" crossorigin="anonymous"></script>

</head>

<body>
    <main class="px-3 md:px-12 lg:px-50 pt-2 mb-15 min-h-screen bg-gray-100 pb-3">
        <div class="rounded-xl bg-gradient-to-b from-orange-400 to-white p-[1px]">
            <div class="rounded-[10px] bg-gradient-to-b from-orange-200 to-white">
                <div class="px-5 py-3">
                    <p class="pt-3 text-md font-bold text-orange-400 ">My Balance</p>
                    <h1 class="pt-1 text-4xl font-black text-gray-700">₦800.00</h1>
                </div>
                <div class="py-3 px-2 flex justify-between">
                    <div class="w-3/6 bg-orange-400 text-center py-2 me-2 rounded-4xl">
                        <a href="deposit.html" class="font-semibold w-100 text-white text-center">Deposit</a>
                    </div>
                    <div class="w-3/6 bg-orange-500 text-center py-2 ms-2 rounded-4xl">
                        <a href="withdraw.html" class="font-semibold w-100 text-white text-center">Withdraw</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="py-1 px-3 my-3 rounded-xl shadow-md bg-white">
            <div class="p-3">
                <a href="bank.html" class="flex justify-between pb-3 pt-2">
                    <div class="flex mx-3">
                        <i class="fa-solid fa-building-columns text-orange-400 text-2xl"></i>
                        <p class="px-2 text-[15px] font-bold text-gray-600">Bank Account</p>
                    </div>
                    <i class="justify-center fa-solid fa-circle-chevron-right text-gray-400 text-xl"></i>
                </a>
                <hr class="border-t border-gray-200 mb-2" />
                <a href="#" class="flex justify-between pb-3 pt-2">
                    <div class="flex mx-3">
                        <i class="fa-solid fa-receipt text-2xl text-orange-400">account_balance</i>
                        <p class="px-2 text-[15px] font-bold text-gray-600">Transaction History</p>
                    </div>
                    <i class="justify-center fa-solid fa-circle-chevron-right text-gray-400 text-xl"></i>
                </a>
                <hr class="border-t border-gray-200 mb-2" />
                <a href="#" class="flex justify-between pb-3 pt-2">
                    <div class="flex mx-3">
                        <i class="fa-solid fa-list-check text-orange-400 text-2xl"></i>
                        <p class="px-2 text-[15px] font-bold text-gray-600">Tasks</p>
                    </div>
                    <i class="justify-center fa-solid fa-circle-chevron-right text-gray-400 text-xl"></i>
                </a>
                <hr class="border-t border-gray-200 mb-2" />

                <a href="#" class="flex justify-between pb-2 pt-3">
                    <div class="flex mx-3">
                        <i class="fa-solid fa-cube text-orange-400 text-2xl"></i>
                        <p class="px-2 text-[15px] font-bold text-gray-600">My Products</p>
                    </div>
                    <i class="justify-center fa-solid fa-circle-chevron-right text-gray-400 text-xl"></i>
                </a>
                <hr class="border-t border-gray-200 mb-2" />

                <a href="gift.html" class="flex justify-between pb-2 pt-3">
                    <div class="flex mx-3">
                        <i class="fa-solid fa-gift text-orange-400 text-2xl"></i>
                        <p class="px-2 text-[15px] font-bold text-gray-600">Gift Code</p>
                    </div>
                    <i class="justify-center fa-solid fa-circle-chevron-right text-gray-400 text-xl"></i>
                </a>
                <hr class="border-t border-gray-200 mb-2" />

                <a href="#" class="flex justify-between pb-2 pt-3">
                    <div class="flex mx-3">
                        <i class="fa-solid fa-user-plus text-orange-400 text-2xl"></i>
                        <p class="px-2 text-[15px] font-bold text-gray-600">My Team</p>
                    </div>
                    <i class="justify-center fa-solid fa-circle-chevron-right text-gray-400 text-xl"></i>
                </a>
                <hr class="border-t border-gray-200 mb-2" />
                <a href="#" class="flex justify-between pb-2 pt-3">
                    <div class="flex mx-3">
                        <i class="fa-solid fa-key text-orange-400 text-2xl"></i>
                        <p class="px-2 text-[15px] font-bold text-gray-600">Reset Password</p>
                    </div>
                    <i class="justify-center fa-solid fa-circle-chevron-right text-gray-400 text-xl"></i>
                </a>
            </div>
        </div>
        <div class="px-3 mb-5 rounded-xl shadow-md bg-white">
            <div class="p-3">
                <a href="#" class="flex justify-between pb-3 pt-2">
                    <div class="flex mx-3">
                        <i class="fa-solid fa-right-from-bracket text-orange-400 text-2xl"></i>
                        <p class="px-2 text-[15px] font-bold text-gray-600">Logout</p>
                    </div>
                    <i class="justify-center fa-solid fa-circle-chevron-right text-gray-400 text-xl"></i>
                </a>
            </div>
        </div>
    </main>
    <footer class=" fixed bottom-0 left-0 w-full z-50 bg-white text-orange-400 shadow-sm h-18">
        <div class="flex items-center justify-around py-3">
            <a href="index.html" class="flex flex-col items-center gap-1 text-orange-400">
                <i class="fa-solid fa-house-user text-orange-400 text-2xl"></i>
                <span class="text-xs font-medium">Home</span>
            </a>
            <a href="products.html" class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fa-solid fa-cube text-gray-400 text-2xl"></i>
                <span class="text-xs font-medium">Products</span>
            </a>
            <a href="tasks.html" class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fa-solid fa-list-check text-gray-400 text-2xl"></i>
                <span class="text-xs font-medium">Tasks</span>
            </a>
            <a href="refer.html" class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fa-solid fa-user-plus text-gray-400 text-2xl"></i>
                <span class="text-xs font-medium">Invite</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fa-solid fa-circle-user text-gray-400 text-2xl"></i>
                <span class="text-xs font-medium">Profile</span>
            </a>
        </div>
    </footer>
</body>

</html>
