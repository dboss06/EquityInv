<!DOCTYPE html>

    <link rel="stylesheet" href="../../src/output.css" />
    <link rel="icon" href="../../assets/favicon.png" type="image/x-icon" />

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://kit.fontawesome.com/46f4625f97.js" crossorigin="anonymous"></script>

</head>

<body>
    <nav class="fixed top-0 left-0 w-full bg-white shadow-gray-100 z-50">
        <div class="flex items-center justify-between px-8 md:px-12 lg:px-50 py-2">
            <div class="flex items-center gap-3">
                <a href="#" class="flex flex-col items-center gap-1 text-orange-400">
                    <span class="material-symbols-rounded icon-fill text-orange-400">arrow_back_ios </span>
                </a>
            </div>
            <div class="text-center">
                <h1 class="text-lg font-medium text-gray-700">Invite Friends</h1>
            </div>
            <div class="flex items-center gap-1.5 text-sm font-medium px-3 py-1 rounded-full">
                <a href="#" class="text-md font-medium text-orange-400">My Team</a>
            </div>

    </nav>
    <main class="pt-10 pb-20 min-h-screen bg-gray-100">
        <div
            class="mt-7 mx-2 md:mx-12 lg:mx-50 bg-white text-white rounded-xl p-7 px-3 md:p-6 lg:p-3 lg:px-5 shadow-xl">
            <h1 class="text-xl text-gray-700 font-extrabold mt-2">My Invite Link</h1>
            <div class="flex items-center gap-3 mt-4">
                <!-- Readonly Link Input -->
                <input type="text" id="inviteLink" readonly
                    value="https://xenovahq.site/register?ref=OLDY1IEX1787482956"
                    class="w-full px-4 py-3 text-sm text-slate-600 bg-white border border-brand-gold rounded-xl focus:outline-none select-all" />

                <!-- Copy Button -->
                <button id="copyBtn" onclick="copyInviteLink()"
                    class="flex items-center justify-center p-2 text-brand-gold border border-brand-gold rounded-xl hover:bg-brand-gold/10 active:scale-95 transition-all shrink-0"
                    title="Copy to clipboard">
                    <span class="material-symbols-rounded text-lg">content_copy</span>
                </button>
            </div>
        </div>
        <div
            class="mt-5 mx-2 md:mx-12 lg:mx-50 bg-white text-white rounded-xl p-7 px-3 md:p-6 lg:p-3 lg:px-5 shadow-xl flex">
            <div class="flex items-center justify-center w-12 h-12 bg-orange-100 rounded-xl m-1 p-7">
                <span class="material-symbols-rounded [font-variation-settings:'FILL'_1] text-orange-600 text-2xl">
                    person
                </span>
            </div>
            <div class="flex font-semibold flex-col ms-4">
                <h1 class="text-gray-700 text-md font-bold">Direct Referrals</h1>
                <p class="bg-orange-500 px-4 py-1.5 text-xs font-bold rounded-sm">Earn 20% commission</p>
            </div>
        </div>
        <div
            class="mt-2 mx-2 md:mx-12 lg:mx-50 bg-white text-white rounded-xl p-7 px-3 md:p-6 lg:p-3 lg:px-5 shadow-xl flex">
            <div class="flex items-center justify-center w-12 h-12 bg-purple-100 rounded-xl m-1 p-7">
                <span class="material-symbols-rounded [font-variation-settings:'FILL'_1] text-purple-600 text-2xl">
                    group
                </span>
            </div>
            <div class="flex font-semibold flex-col ms-4">
                <h1 class="text-gray-700 text-md font-bold">Second Level</h1>
                <p class="bg-purple-600 px-4 py-1.5 text-xs font-bold rounded-sm">Earn 3% commission</p>
            </div>
        </div>
        <div
            class="mt-2 mx-2 md:mx-12 lg:mx-50 bg-white text-white rounded-xl p-7 px-3 py-4 md:p-6 lg:p-3 lg:px-5 shadow-xl flex">
            <div class="flex items-center justify-center w-12 h-12 bg-green-100 rounded-xl m-1 p-7">
                <span class="material-symbols-rounded [font-variation-settings:'FILL'_1] text-green-600 text-2xl">
                    groups_3
                </span>
            </div>
            <div class="flex font-semibold flex-col ms-4">
                <h1 class="text-gray-700 text-md font-bold">Third Level</h1>
                <p class="bg-green-600 px-4 py-1.5 text-xs font-bold rounded-sm">Earn 20% commission</p>
            </div>
        </div>
    </main>
    <footer class=" fixed bottom-0 left-0 w-full z-50 bg-white text-orange-400 shadow-sm h-18">
        <div class="flex items-center justify-around py-3">
            <a href="../User/index.html" class="flex flex-col items-center gap-1 text-orange-400">
                <i class="fa-solid fa-house-user text-orange-400 text-2xl"></i>
                <span class="text-xs font-medium">Home</span>
            </a>
            <a href="../User/products.html" class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fa-solid fa-cube text-gray-400 text-2xl"></i>
                <span class="text-xs font-medium">Products</span>
            </a>
            <a href="../User/tasks.html" class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fa-solid fa-list-check text-gray-400 text-2xl"></i>
                <span class="text-xs font-medium">Tasks</span>
            </a>
            <a href="../User/refer.html" class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fa-solid fa-user-plus text-gray-400 text-2xl"></i>
                <span class="text-xs font-medium">Invite</span>
            </a>
            <a href="../User/profile.html" class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fa-solid fa-circle-user text-gray-400 text-2xl"></i>
                <span class="text-xs font-medium">Profile</span>
            </a>
        </div>
    </footer>
</body>

</html>
<script>
    function copyInviteLink() {
        const linkInput = document.getElementById("inviteLink");

        // Select the text inside the input
        linkInput.select();
        linkInput.setSelectionRange(0, 99999); // For mobile devices

        // Copy to clipboard
        navigator.clipboard.writeText(linkInput.value).then(() => {
            // Optional: Visual feedback on copy
            const copyBtn = document.getElementById("copyBtn");
            copyBtn.classList.add("bg-brand-gold", "text-white");

            setTimeout(() => {
                copyBtn.classList.remove("bg-brand-gold", "text-white");
            }, 1500);
        });
    }
</script>
